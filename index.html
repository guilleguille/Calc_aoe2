<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1118">
<title>AoE2 DE · Calculadora de Economía</title>

<style>
:root{
  --bg:#080d13;
  --panel:#101923;
  --line:#29394d;
  --text:#f4f1e8;
  --muted:#9daabd;
  --gold:#e4b358;
}

*{box-sizing:border-box}

html{background:var(--bg)}

body{
  margin:0;
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:radial-gradient(circle at 50% -20%,#223247 0,#0b121b 36%,#070b10 100%);
}

button,select,input{font:inherit}

.app{
  max-width:1050px;
  margin:auto;
  padding:12px 11px 130px;
}

header{
  padding:7px 3px 12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:44px;
  height:44px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-size:24px;
  background:linear-gradient(145deg,#d2a24b,#543819);
}

h1{
  margin:0;
  font-size:21px;
}

.subtitle{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.card{
  background:linear-gradient(180deg,#131d29,#0e1720);
  border:1px solid var(--line);
  border-radius:17px;
  padding:12px;
  margin:9px 0;
  box-shadow:0 10px 30px #0005;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:5px;
}

select,
input[type="number"],
input[type="search"]{
  width:100%;
  background:#091119;
  color:white;
  border:1px solid #35475d;
  border-radius:10px;
  padding:10px;
}

.sectionhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.sectionhead strong{
  font-size:14px;
}

.micro{
  color:var(--muted);
  font-size:9px;
}

.status{
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--muted);
  font-size:9px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#bd8842;
}

.dot.ok{background:#72c68e}
.dot.bad{background:#d2695b}

.toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:7px;
}

.smallbtn{
  background:#0b131c;
  color:white;
  border:1px solid var(--line);
  border-radius:10px;
  padding:0 12px;
}

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  margin:8px 0;
}

.tabs::-webkit-scrollbar{display:none}

.tab,.chip{
  border:1px solid var(--line);
  background:#0b131c;
  color:#d2dbe5;
  border-radius:9px;
  padding:7px 9px;
  white-space:nowrap;
  font-size:10px;
}

.tab.on,.chip.on{
  border-color:var(--gold);
  background:#4c391e;
  color:#ffe2a4;
}

.upgrades{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.unitgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.unit{
  position:relative;
  display:grid;
  grid-template-columns:60px 1fr;
  gap:8px;
  min-height:92px;
  padding:7px;
  background:linear-gradient(145deg,#101a27,#0a1118);
  border:1px solid var(--line);
  border-radius:14px;
  cursor:pointer;
}

.unit.active{
  border-color:var(--gold);
  box-shadow:inset 0 0 0 1px #e4b35855;
}

.pic{
  width:60px;
  height:60px;
  border-radius:11px;
  overflow:hidden;
  border:1px solid #3b4d63;
  background:#1c2836;
  display:grid;
  place-items:center;
  font-size:24px;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.unit h3{
  margin:2px 0 4px;
  font-size:11px;
  line-height:1.15;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
}

.tag{
  background:#202d3d;
  border-radius:5px;
  padding:2px 4px;
  font-size:8px;
}

.meta{
  color:var(--muted);
  font-size:8px;
  margin-top:4px;
}

.qty{
  position:absolute;
  right:6px;
  bottom:6px;
  display:flex;
  gap:3px;
  align-items:center;
}

.qty button{
  width:24px;
  height:24px;
  border:0;
  border-radius:6px;
  background:#293a50;
  color:white;
}

.qty b{
  min-width:24px;
  text-align:center;
  font-size:10px;
}

.loading,.error,.empty{
  padding:24px 12px;
  border:1px dashed #35485f;
  border-radius:13px;
  color:var(--muted);
  text-align:center;
  font-size:11px;
}

details{
  margin-top:8px;
}

summary{
  color:#d7e0e9;
  font-size:10px;
}

.advanced{
  padding-top:8px;
}

.note{
  color:var(--muted);
  font-size:9px;
  line-height:1.45;
  margin-top:8px;
}

.result{
  position:fixed;
  left:50%;
  bottom:7px;
  transform:translateX(-50%);
  width:min(1028px,calc(100% - 18px));
  padding:9px;
  z-index:20;
  background:#101a25f5;
  border:1px solid #465c75;
  border-radius:17px;
  box-shadow:0 12px 44px #000c;
  backdrop-filter:blur(12px);
}

.resources{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
}

.resource{
  text-align:center;
  background:#081018;
  border-radius:10px;
  padding:7px;
}

.resource b{
  display:block;
  font-size:21px;
}

.resource span{
  color:var(--muted);
  font-size:8px;
}

.summary{
  margin-top:6px;
  color:#bec9d5;
  font-size:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

@media(max-width:760px){
  .unitgrid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:490px){

  .grid{
    grid-template-columns:1fr;
  }

  .unitgrid{
    grid-template-columns:1fr;
  }

  .unit{
    min-height:80px;
    grid-template-columns:54px 1fr;
  }

  .pic{
    width:54px;
    height:54px;
  }

  .resource b{
    font-size:19px;
  }
}
</style>
</head>

<body>

<main class="app">

<header>
<div class="brand">

<div class="logo">⚔</div>

<div>

<section class="card">

<div style="height:9px"></div>


<div class="grid">

<div class="field">

<input id="foodMult" type="number" step=".01" value="1">
</div>

<div class="field">
<label>Multiplicador madera</label>
<input id="woodMult" type="number" step=".01" value="1">
</div>

<div class="field">
<label>Multiplicador oro</label>
<input id="goldMult" type="number" step=".01" value="1">
</div>

<div class="field">

<input id="stoneMult" type="number" step=".01" value="1">

</div>

</div>

</details>

</section>


<section class="card">

<div class="sectionhead">

<strong>Unidades disponibles</strong>

</div>


<div class="toolbar">

<input
id="search"
type="search"
placeholder="Buscar unidad…"
>

<button
class="smallbtn"
id="clearBtn"
>
Limpiar
</button>

</div>


<div
class="tabs"
id="tabs"
></div>


<div
class="unitgrid"
id="units"
>

Descargando datos…
</div>

</div>

</section>

</main>


<div class="result">

<div class="resources">

<div class="resource">
<b id="outFood">0.0</b>
<span>🍖 COMIDA</span>
</div>

<b id="outWood">0.0</b>
<span>🪵 MADERA</span>
</div>

<b id="outGold">0.0</b>
<span>🪙 ORO</span>
</div>

<div class="resource">
<b id="outStone">0.0</b>

</div>

</div>


<div
class="summary"
id="summary"

<script>

/*
=============================================================
DATOS
=============================================================
*/

const DATA_SOURCES = [

'https://cdn.jsdelivr.net/gh/SiegeEngineers/aoe2techtree@master/data/data.json',

'https://raw.githubusercontent.com/SiegeEngineers/aoe2techtree/master/data/data.json'

];


/*
=============================================================
IMÁGENES

Probamos tres fuentes automáticamente.
=============================================================
*/

function imageSources(id){

return [

`https://cdn.jsdelivr.net/gh/SiegeEngineers/aoe2techtree@master/img/Unit/${id}.png`,

`https://raw.githubusercontent.com/SiegeEngineers/aoe2techtree/master/img/Unit/${id}.png`,

`https://github.com/SiegeEngineers/aoe2techtree/raw/refs/heads/master/img/Unit/${id}.png`

];

}


function nextImage(img,id){

let index =
Number(
img.dataset.source || 0
);

index++;

const sources =
imageSources(id);


if(
index <
sources.length
){

img.dataset.source =
index;

img.src =
sources[index];

}else{

img.style.display =
'none';

img.parentElement.textContent =
'⚔️';

}

}


/*
=============================================================
ESTADO
=============================================================
*/

const $ =
id =>
document.getElementById(id);


let raw = null;

let units = [];

let civs = {};

let selected = {};

let filter =
'Todas';

let activeUpgrades =
new Set();


/*
=============================================================

=============================================================
*/

const esCivs = {

/*
=============================================================
RECURSOS
=============================================================
*/

function resMap(arr){

const result = {

Food:0,

Wood:0,

Gold:0,

Stone:0

};


(arr || [])
.forEach(c=>{

if(
c &&
c.Type &&
result[c.Type] !== undefined
){

result[c.Type] +=
Number(c.Amount) || 0;

}

});


return result;

}


/*
=============================================================
CLASIFICACIÓN
=============================================================
*/

function classify(name){

const n =
name.toLowerCase();


if(
/galley|galleon|fire ship|demolition|longboat|turtle ship|caravel|cannon galleon|dromon/.test(n)
){

return 'Naval';

}


if(
/monk|missionary/.test(n)
){

return 'Monjes';

}


if(
/ram|mangonel|onager|scorpion|trebuchet|bombard cannon|petard|houfnice|siege|organ gun|hussite wagon/.test(n)
){

return 'Asedio';

}


if(
/archer|bowman|skirmisher|crossbow|arbalest|janissary|hand cannoneer|chu ko nu|gbeto|mameluke|chakram|conquistador|arambai|wagon|ratha/.test(n)
){

return 'Arqueros';

}


if(
/knight|caval|hussar|camel|paladin|cavalier|tarkan|cataphract|leitis|keshik|konnik|monaspa|coustillier|elephant/.test(n)
){

return 'Caballería';

}


return 'Infantería';

}


function isMilitary(name){

const n =
name.toLowerCase();


return !(
/villager|trade cart|trade cog|fishing ship|transport ship|sheep|boar|deer|wolf|horse$|cow|goat|llama|buffalo|turkey|relic|king/.test(n)
);

}


/*
=============================================================
CARGA DE DATOS CON FALLBACK
=============================================================
*/

async function fetchData(){

let lastError = null;


for(
const url
of
DATA_SOURCES
){

try{

const response =
await fetch(
url,
{
cache:'no-store'
}
);


if(
!response.ok
){

throw new Error(
'HTTP ' +
response.status
);

}


return await
response.json();

}catch(error){

lastError =
error;

}

}


throw lastError ||
new Error(
'No se pudieron cargar los datos'
);

}


/*
=============================================================
CARGA
=============================================================
*/

async function load(){

try{

raw =
await fetchData();


civs =
raw.civs || {};


const unitData =
raw.data?.Unit || {};


units =
Object
.entries(unitData)
.map(
([id,u])=>{

const cost =
resMap(
u.Cost
);


return {

id:
Number(id),

name:
u.internal_name ||
('Unidad ' + id),

display:
nameES[
u.internal_name
]
||
u.internal_name
||
('Unidad ' + id),

food:
cost.Food,

wood:
cost.Wood,

gold:
cost.Gold,

stone:
cost.Stone,

time:
Number(
u.TrainTime
)
||
0,

cat:
classify(
u.internal_name || ''
)

};

}
)
.filter(
u=>
u.time > 0
&&
isMilitary(
u.name
)
&&
(
u.food
||
u.wood
||
u.gold
||
u.stone
)
);


$('civ')
.innerHTML =
Object
.keys(civs)
.sort(
(a,b)=>
(esCivs[a] || a)
.localeCompare(
esCivs[b] || b,
'es'
)
)
.map(
c=>
`<option value="${c}">
${esCivs[c] || c}
</option>`
)
.join('');


if(
civs.Britons
){

$('civ').value =
'Britons';

}


$('statusDot')
.className =
'dot ok';


$('statusText')
.textContent =
'Datos cargados';


buildTabs();

render();

calc();

}catch(error){

console.error(error);


$('statusDot')
.className =
'dot bad';


$('statusText')
.textContent =
'Error';


$('units')
.innerHTML =
`
<div class="error">
No se han podido cargar los datos.
Recarga la página.
</div>
`;

}

}


/*
=============================================================
DISPONIBILIDAD POR CIVILIZACIÓN
=============================================================
*/

function availableUnits(){

const civ =
civs[
$('civ').value
];


if(
!civ
){

return units;

}


const ids =
new Set(
(civ.Unit || [])
.map(Number)
);


return units.filter(
u=>
ids.has(
u.id
)
);

}


/*
=============================================================
PESTAÑAS
=============================================================
*/

function buildTabs(){

const cats = [

'Todas',

'Infantería',

'Arqueros',

'Caballería',

'Asedio',

'Monjes',

'Naval'

];


$('tabs')
.innerHTML =
cats
.map(
c=>
`
<button
class="tab ${c === 'Todas' ? 'on' : ''}"
data-cat="${c}"
>
${c}
</button>
`
)
.join('');

}


/*
=============================================================
DIBUJAR UNIDADES
=============================================================
*/

function render(){

if(
!raw
){

return;

}


let list =
availableUnits();


const q =
$('search')
.value
.trim()
.toLowerCase();


if(
filter !==
'Todas'
){

list =
list.filter(
u=>
u.cat ===
filter
);

}


if(q){

list =
list.filter(
u=>
(
u.display +
' ' +
u.name
)
.toLowerCase()
.includes(q)
);

}


$('unitCount')
.textContent =
list.length +
' unidades';


if(
!list.length
){

$('units')
.innerHTML =
`
<div class="empty">
No hay unidades con este filtro.
</div>
`;

return;

}


$('units')
.innerHTML =
list
.map(
u=>{

const amount =
selected[u.id] || 0;


const src =
imageSources(
u.id
)[0];


return `

<article
class="unit ${amount ? 'active' : ''}"
onclick="toggleUnit(${u.id})"
>

<div class="pic">

<img
src="${src}"
data-source="0"
loading="lazy"
alt="${u.display}"
onerror="nextImage(this,${u.id})"
>

</div>


<div>

<h3>
${u.display}
</h3>


<div class="tags">

${u.food
?
`<span class="tag">🍖 ${u.food}</span>`
:
''}

${u.wood
?
`<span class="tag">🪵 ${u.wood}</span>`
:
''}

${u.gold
?
`<span class="tag">🪙 ${u.gold}</span>`
:
''}

${u.stone
?
`<span class="tag">🪨 ${u.stone}</span>`
:
''}

</div>


<div class="meta">

${u.cat}
·
${u.time}s

</div>

</div>


<div
class="qty"
onclick="event.stopPropagation()"
>

<button
onclick="changeQty(${u.id},-1)"
>
−
</button>

<b>
${amount}
</b>

<button
onclick="changeQty(${u.id},1)"
>
+
</button>

</div>

</article>

`;

}
)
.join('');

}


/*
=============================================================
CANTIDADES
=============================================================
*/

function toggleUnit(id){

selected[id] =
selected[id]
?
0
:
1;


render();

calc();

}


function changeQty(id,d){

selected[id] =
Math.max(
0,
(selected[id] || 0)
+
d
);


render();

calc();

}


/*
=============================================================
VELOCIDADES DE RECOLECCIÓN
=============================================================
*/

function rates(){

const foodBase = {

farm:.32,

sheep:.34,

boar:.41,

berries:.31,

fish:.43

}[
$('foodSource')
.value
]
||
.32;


let r = {

food:
foodBase,

wood:
.39,

gold:
.38,

stone:
.36

};


if(
activeUpgrades
.has(
'wheelbarrow'
)
){

Object
.keys(r)
.forEach(
k=>
r[k] *=
1.03
);

}


if(
activeUpgrades
.has(
'handcart'
)
){

Object
.keys(r)
.forEach(
k=>
r[k] *=
1.05
);

}


if(
activeUpgrades.has('wood1')
){
r.wood *= 1.10;
}


if(
activeUpgrades.has('wood2')
){
r.wood *= 1.20;
}


if(
activeUpgrades.has('wood3')
){
r.wood *= 1.10;
}


if(
activeUpgrades.has('gold1')
){
r.gold *= 1.15;
}


if(
activeUpgrades.has('gold2')
){
r.gold *= 1.15;
}


if(
activeUpgrades.has('stone1')
){
r.stone *= 1.15;
}


if(
activeUpgrades.has('stone2')
){
r.stone *= 1.15;
}


r.food *=
Number(
$('foodMult').value
)
||
1;


r.wood *=
Number(
$('woodMult').value
)
||
1;


r.gold *=
Number(
$('goldMult').value
)
||
1;


r.stone *=
Number(
$('stoneMult').value
)
||
1;


const efficiency =
Math.min(
1,
Math.max(
.5,
Number(
$('efficiency').value
)
||
.95
)
);


Object
.keys(r)
.forEach(
k=>
r[k] *=
efficiency
);


return r;

}


/*
=============================================================
CÁLCULO
=============================================================
*/

function calc(){

if(
!raw
){

return;

}


const r =
rates();


const trainingSpeed =
Math.max(
.1,
Number(
$('trainMult')
.value
)
||
1
);


const need = {

food:0,

wood:0,

gold:0,

stone:0

};


const names = [];

let totalLines = 0;


Object
.entries(selected)
.forEach(
([id,count])=>{

count =
Number(count) || 0;


if(
count <= 0
){

return;

}


const unit =
units.find(
u=>
u.id ===
Number(id)
);


if(
!unit
){

return;

}


const unitsPerSecond =
count *
trainingSpeed /
unit.time;


need.food +=
unit.food *
unitsPerSecond;


need.wood +=
unit.wood *
unitsPerSecond;


need.gold +=
unit.gold *
unitsPerSecond;


need.stone +=
unit.stone *
unitsPerSecond;


totalLines +=
count;


names.push(
`${unit.display} ×${count}`
);

}
);


$('outFood')
.textContent =
(
need.food /
r.food
)
.toFixed(1);


$('outWood')
.textContent =
(
need.wood /
r.wood
)
.toFixed(1);


$('outGold')
.textContent =
(
need.gold /
r.gold
)
.toFixed(1);


$('outStone')
.textContent =
(
need.stone /
r.stone
)
.toFixed(1);


$('summary')
.textContent =
totalLines
?
names.join(' · ')
:
'Selecciona una unidad para empezar.';

}


/*
=============================================================
EVENTOS
=============================================================
*/

$('tabs')
.addEventListener(
'click',
e=>{

const button =
e.target.closest(
'[data-cat]'
);


if(
!button
){

return;

}


filter =
button.dataset.cat;


document
.querySelectorAll(
'.tab'
)
.forEach(
tab=>
tab
.classList
.toggle(
'on',
tab.dataset.cat === filter
)
);


render();

}
);


$('search')
.addEventListener(
'input',
render
);


$('civ')
.addEventListener(
'change',
()=>{

selected = {};

render();

calc();

}
);


$('foodSource')
.addEventListener(
'change',
calc
);


$('clearBtn')
.addEventListener(
'click',
()=>{

selected = {};

$('search').value =
'';

render();

calc();

}
);


$('upgrades')
.addEventListener(
'click',
e=>{

const button =
e.target.closest(
'[data-up]'
);


if(
!button
){

return;

}


const key =
button.dataset.up;


if(
activeUpgrades.has(key)
){

activeUpgrades.delete(key);

}else{

activeUpgrades.add(key);

}


button
.classList
.toggle(
'on',
activeUpgrades.has(key)
);


calc();

}
);


[
'foodMult',
'woodMult',
'goldMult',
'stoneMult',
'trainMult',
'efficiency'
]
.forEach(
id=>
$(id)
.addEventListener(
'input',
calc
)
);


/*
=============================================================
INICIAR
=============================================================
*/

load();

</script>

</body>
</html>
